<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <style>
        body {
            margin: 0;
            background: #121212; /* Softer black for better contrast */
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: #a0a0a0;
        }

        .icon {
            display: inline-block;
            animation: pulse 2s infinite;
        }

        /* A gentle pulsing animation for the satellite icon */
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div>
        <h1>No Internet <span class="icon">📡</span></h1>
        <p>You are offline now.</p>
    </div>

</body>
</html>
